services:
  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: kultur-studentperformance-panel,kultur-studenttrend-panel,kultur-studentscore-datasource
    volumes:
      - ./dist:/var/lib/grafana/plugins/kultur-studentperformance-panel:ro
      - ./dist-trend:/var/lib/grafana/plugins/kultur-studenttrend-panel:ro
      - ./dist-score-data:/var/lib/grafana/plugins/kultur-studentscore-datasource:ro
      - ./demo/student-performance.json:/opt/student-performance/demo/dashboard/student-performance.json:ro
      - ./demo/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
volumes:
  grafana-data:
